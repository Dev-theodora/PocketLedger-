<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PocketLedger - Expense Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PocketLedger</h1>
    <p>Track your money, understand your spending.</p>
  </header>

  <main>
    <section class="summary">
      <div class="summary-card">
        <h2>Total Income</h2>
        <p id="totalIncome">₦0.00</p>
      </div>

      <div class="summary-card">
        <h2>Total Expenses</h2>
        <p id="totalExpenses">₦0.00</p>
      </div>

      <div class="summary-card">
        <h2>Balance</h2>
        <p id="balance">₦0.00</p>
      </div>
    </section>

    <section class="transaction-form" id="editSection" style="display: none;">
  <h2>Edit Transaction</h2>

  <form id="editForm">
    <label for="editDescription">Description</label>
    <input type="text" id="editDescription" required>

    <label for="editAmount">Amount (₦)</label>
    <input type="number" id="editAmount" min="0.01" step="0.01" required>

    <label for="editType">Transaction Type</label>
    <select id="editType">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <label for="editCategory">Category</label>
    <select id="editCategory">
      <option value="Salary">Salary</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Shopping">Shopping</option>
      <option value="Bills">Bills</option>
      <option value="Other">Other</option>
    </select>

    <label for="editDate">Date</label>
    <input type="date" id="editDate" required>

    <button type="submit">Save Changes</button>
    <button type="button" id="cancelEdit">Cancel</button>
  </form>
</section>

    <section class="transaction-form">
      <h2>Add Transaction</h2>

      <form id="transactionForm">
        <label for="description">Description</label>
        <input
          type="text"
          id="description"
          placeholder="e.g. Transport"
          required
        >

        <label for="amount">Amount (₦)</label>
        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="0.01"
          step="0.01"
          required
        >

        <label for="type">Transaction Type</label>
        <select id="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <label for="category">Category</label>
        <select id="category" required>
          <option value="Salary">Salary</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="transactions">
      <h2>Transactions</h2>

      <input
        type="search"
        id="searchInput"
        placeholder="Search transactions..."
      >

      <select id="filterType">
        <option value="all">All Transactions</option>
        <option value="income">Income Only</option>
        <option value="expense">Expenses Only</option>
      </select>

      <div id="transactionList">
        <p>No transactions yet.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
  </html>
